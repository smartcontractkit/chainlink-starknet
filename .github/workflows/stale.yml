name: Manage stale PRs

on:
  schedule:
    - cron: "30 0 * * *" # will be triggered daily at 00:30 UTC.
permissions: {}
jobs:
  stale-prs:
    permissions:
      actions: write
      contents: write
      issues: write
      pull-requests: write
    uses: smartcontractkit/.github/.github/workflows/reusable-stale-prs-issues.yml@7dba76d410eaa9c0fbd0dd2107df4a1b7c07aa75 # 2025-06-05
    with:
      days-before-pr-stale: 30 # days
      days-before-pr-close: 7 # days
    secrets:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
